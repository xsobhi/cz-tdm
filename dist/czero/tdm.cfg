// CZ TDM settings - only executed by the TDM build (dlls/cstdm), never by the original game.
// Edit freely; changes apply on the next map load.
echo "Executing tdm.cfg"

// --- team deathmatch ---
mp_round_infinite 1          // the round never ends (no restarts when a team is wiped out)
mp_forcerespawn 2            // respawn 2 seconds after death
mp_respawn_immunitytime 2    // 2 seconds of spawn protection
mp_freezetime 0
mp_give_player_c4 0
mp_buytime -1                // buying allowed any time (inside buy zones)
mp_timelimit 0               // no map change; e.g. 20 = 20 minute matches
mp_fraglimit 0

// --- loadout ---
mp_respawn_keep_weapons 1    // respawn with the weapons you died with, full ammo
mp_infinite_ammo 2           // 2 = reserve ammo never runs out (you still reload)

// --- health regeneration ---
mp_hp_regen 5                // HP per tick (0 = off)
mp_hp_regen_delay 4          // seconds without taking damage before it starts
mp_hp_regen_interval 0.5     // seconds between ticks

// --- weapons on the ground ---
mp_armoury_respawn_time 20   // map weapons come back 20s after being picked up (0 = never)
mp_item_staytime 30          // guns dropped by dead players disappear after 30s

// --- announcer ---
mp_kill_announcer 1          // headshot, double/triple kill, rampage, revenge... (sound/tdm/*.wav)
sv_allowdownload 1           // friends without the mod download the voice pack when they join

// Put your own overrides in czero/tdm_custom.cfg - it survives updates of this file.
exec tdm_custom.cfg
